name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Configuration/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Test, build and render standalone samples
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build.sh --universal
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Package and verify downloads
        run: |
          python -m pip install dmgbuild==1.6.7
          ./scripts/package-dmg.sh
          ditto -c -k --keepParent ".build/distribution/Monthly Native.app" dist/MonthlyNative.zip
          cd dist
          shasum -a 256 MonthlyNative.dmg MonthlyNative.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Monthly Native ${GITHUB_REF_NAME#v}" \
            --notes-file Docs/RELEASE_NOTES.md \
            dist/MonthlyNative.dmg dist/MonthlyNative.zip dist/SHA256SUMS.txt
